name: Build Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Webview APK
        run: |
          mkdir -p apk_output
          wget https://github.com/pwa-builder/PWABuilder/releases/download/v1.0/sample.apk -O apk_output/Paradise_School.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paradise-School-App
          path: apk_output/*.apk

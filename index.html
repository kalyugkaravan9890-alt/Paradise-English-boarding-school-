<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paradise English Boarding School</title>
    
    <!-- PWA Setup -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4A3F9D">

    <style>
        :root {
            --primary: #4A3F9D;
            --primary-dark: #372E7A;
            --primary-light: #EEECF9;
            --accent: #FFB800;
            --bg-color: #F4F5FA;
            --card-bg: #FFFFFF;
            --text-main: #2C2C2E;
            --text-sub: #6C6C70;
            --border-color: #E2E2E9;
            --danger: #FF4D4D;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h2 {
            color: var(--primary);
            text-align: center;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }

        button.primary-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button.primary-btn:hover {
            background-color: var(--primary-dark);
        }

        .homework-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-light);
            padding: 10px 15px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .delete-btn {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Paradise English School</h2>

        <!-- Homework Section -->
        <div class="card">
            <h3>Add Homework</h3>
            <input type="text" id="hwTitle" placeholder="Enter Homework Details...">
            <button class="primary-btn" onclick="addHomework()">Post Homework</button>
        </div>

        <div class="card">
            <h3>Homework List</h3>
            <div id="homeworkList">
                <!-- Homework items will load here -->
            </div>
        </div>
    </div>

    <script>
        // LocalStorage bata data load garne
        let homeworks = JSON.parse(localStorage.getItem('paradise_homeworks')) || [];

        function saveData() {
            localStorage.setItem('paradise_homeworks', JSON.stringify(homeworks));
        }

        function renderHomeworks() {
            const listContainer = document.getElementById('homeworkList');
            listContainer.innerHTML = '';

            if (homeworks.length === 0) {
                listContainer.innerHTML = '<p style="color: var(--text-sub);">No homework added yet.</p>';
                return;
            }

            homeworks.forEach((hw, index) => {
                const item = document.createElement('div');
                item.className = 'homework-item';
                item.innerHTML = `
                    <span>${hw}</span>
                    <button class="delete-btn" onclick="deleteHomework(${index})">Delete</button>
                `;
                listContainer.appendChild(item);
            });
        }

        function addHomework() {
            const input = document.getElementById('hwTitle');
            const value = input.value.trim();

            if (value === '') {
                alert('Please enter homework details!');
                return;
            }

            homeworks.push(value);
            saveData();
            renderHomeworks();
            input.value = '';
        }

        function deleteHomework(index) {
            homeworks.splice(index, 1);
            saveData();
            renderHomeworks();
        }

        // Page load huda list dekhaune
        window.onload = function() {
            renderHomeworks();
        };
    </script>
</body>
</html>
